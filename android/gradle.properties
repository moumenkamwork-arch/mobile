org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The project lives on E: while the pub-cache (plugin sources) lives on C: —
# Kotlin's incremental compiler tries to save a relative path between files on
# two different Windows drive roots when persisting its cache, which throws
# (harmless — the build still succeeds — but prints a scary stack trace on
# every build). Disabling incremental compilation avoids that code path
# entirely instead of just tolerating the noise. Slightly slower rebuilds,
# correctness unaffected.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
